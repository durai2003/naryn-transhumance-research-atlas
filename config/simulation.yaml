# Reproducible Synthetic Transhumance Simulation Configuration
# All generated herds, pastures, routes and trajectories are synthetic demonstrations.
simulation_version: "2.0.0"
random_seed: 42
study_area: "Naryn Region, Kyrgyzstan"
study_area_qid: "Q486375"
reference_city_qid: "Q311946"
reference_city_elevation_m: 2044.0

# Simulation period (must fall within actual NASA POWER daily coverage 2015-2025)
simulation_year: 2024
start_date: "2024-01-01"
end_date: "2024-12-31"

# Population and landscape sizes
num_herds: 48
num_pastures: 18
num_corridors_target: 16

# Species proportions and movement profiles
species_profiles:
  sheep:
    weight: 0.34
    min_size: 120
    max_size: 420
    speed_km_day_range: [7.0, 12.0]
    preferred_summer_band: "high_alpine"
  goat:
    weight: 0.16
    min_size: 60
    max_size: 220
    speed_km_day_range: [8.0, 13.5]
    preferred_summer_band: "high_alpine"
  cattle:
    weight: 0.16
    min_size: 35
    max_size: 140
    speed_km_day_range: [5.5, 9.5]
    preferred_summer_band: "foothill_transition"
  horse:
    weight: 0.14
    min_size: 25
    max_size: 110
    speed_km_day_range: [11.0, 18.0]
    preferred_summer_band: "high_alpine"
  mixed:
    weight: 0.20
    min_size: 90
    max_size: 320
    speed_km_day_range: [6.5, 11.5]
    preferred_summer_band: "high_alpine"

# Staggered annual calendar ranges (day-of-year windows)
calendar_windows:
  spring_departure_doy: [88, 122]
  summer_departure_doy: [148, 178]
  autumn_departure_doy: [238, 268]
  winter_return_doy: [292, 326]
  rest_days_range: [2, 8]

# Routing grid resolution in projected metres (EPSG:32643)
routing:
  metric_crs: "EPSG:32643"
  grid_cell_size_m: 3500
  max_passable_slope_deg: 36.0
  elevation_barrier_m: 4100.0

provenance:
  is_synthetic: true
  provenance_label: "synthetic_demo"
  disclaimer: "Synthetic educational demonstration only. Generated herds, candidate grazing locations, modelled corridors, and climate scenario trajectories are fictional and must not be interpreted as verified field observations, GPS tracks, or official pasture rights."
